# Adds fpm_service tag from the phpfpm input url, e.g. fcgi://my-shop-fpm:9000/status -> my-shop
[[processors.regex]]
    namepass = ["phpfpm"]
    [[processors.regex.tags]]
        key = "url"
        pattern = "^fcgi://([^/:]+)-fpm:[0-9]+/status$"
        replacement = "$1"
        result_key = "fpm_service"
