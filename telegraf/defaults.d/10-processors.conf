# Adds service tag from the phpfpm input url, e.g. fcgi://my-shop-fpm:9000/status -> my-shop-fpm
[[processors.regex]]
    namepass = ["phpfpm"]
    [[processors.regex.tags]]
        key = "url"
        pattern = "^fcgi://([^/:]+):[0-9]+/status$"
        replacement = "$1"
        result_key = "service"

# Renames the server tag of all redis input metrics (redis, redis_keyspace, redis_cmdstat, ...) to service
[[processors.rename]]
    namepass = ["redis", "redis_*"]
    [[processors.rename.replace]]
        tag = "server"
        dest = "service"


# Renames the server tag of nginx input metrics to service
[[processors.rename]]
    namepass = ["nginx", "nginx_*"]
    [[processors.rename.replace]]
        tag = "server"
        dest = "service"

# Adds service tag from the rabbitmq input url (also used for LavinMQ), e.g. http://lavinmq:15672 -> lavinmq
[[processors.regex]]
    namepass = ["rabbitmq_*"]
    [[processors.regex.tags]]
        key = "url"
        # must match the whole url, otherwise the unmatched rest (port, path) ends up in the tag
        pattern = "^https?://([^/:]+)(:[0-9]+)?(/.*)?$"
        replacement = "$1"
        result_key = "service"

# Adds service tag from the prometheus input url (e.g. frankenphp), e.g. http://app:2020/metrics -> app.
# The prometheus input must use metric_version = 2: all its metrics are then named "prometheus" here,
# and only v2 relays names and histograms unchanged through the prometheus_client output.
[[processors.regex]]
    namepass = ["prometheus"]
    [[processors.regex.tags]]
        key = "url"
        # must match the whole url, otherwise the unmatched rest (port, path) ends up in the tag
        pattern = "^https?://([^/:]+)(:[0-9]+)?(/.*)?$"
        replacement = "$1"
        result_key = "service"