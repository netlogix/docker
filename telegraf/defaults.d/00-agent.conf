# Default agent + prometheus output.
# To change agent settings, replace this whole file by mounting your own at
# /etc/telegraf/defaults.d/00-agent.conf (telegraf does not support overlapping [agent] tables).
[agent]
    interval = "10s"
    round_interval = true
    metric_batch_size = 1000
    metric_buffer_limit = 10000
    collection_jitter = "0s"
    flush_interval = "10s"
    flush_jitter = "0s"
    # container hostnames are random and would create new prometheus series on every restart
    omit_hostname = true

[[outputs.prometheus_client]]
    listen = ":9273"
    metric_version = 2
