name: 'Build prometheus-php-fpm-exporter docker image'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: 0 7 * * THU
  push:
    branches:
      - main
    paths:
      - prometheus-php-fpm-exporter/**
  pull_request:
    branches:
      - main
    paths:
      - prometheus-php-fpm-exporter/**
  workflow_dispatch:
    inputs: {}

jobs:
  build-docker-image:
    name: 'Build prometheus-php-fpm-exporter docker image'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read version from Dockerfile
        id: docker
        # Go-built exporters: the first version in the Dockerfile is golang's, so read EXPORTER_VERSION instead of using extract-version.sh
        run: echo "version=$(sed -nE "s/^ARG EXPORTER_VERSION=['\"]?v?([0-9][0-9.]*)['\"]?$/\1/p" ./prometheus-php-fpm-exporter/Dockerfile)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (prometheus-php-fpm-exporter)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./prometheus-php-fpm-exporter
          target: prometheus-php-fpm-exporter
          file: ./prometheus-php-fpm-exporter/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/netlogix/docker/prometheus-php-fpm-exporter:latest,ghcr.io/netlogix/docker/prometheus-php-fpm-exporter:${{ steps.docker.outputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha, mode=max

