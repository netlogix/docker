name: 'Build OpenSearch docker image'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: 0 7 * * THU
  push:
    branches:
      - main
    paths:
      - opensearch/**
      - .github/workflows/opensearch.yml
      - .github/action/endoflife/**
  pull_request:
    branches:
      - main
    paths:
      - opensearch/**
      - .github/workflows/opensearch.yml
      - .github/action/endoflife/**
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read
  packages: write

jobs:
  version-matrix:
    name: 'Generate version-matrix'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.version-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/action/endoflife
        id: version-matrix
        with:
          product: 'opensearch'

      - name: Show matrix output
        run: echo '${{ steps.version-matrix.outputs.matrix }}'

  build-docker-image:
    name: 'Build opensearch docker image - ${{ matrix.image.name }} (${{ matrix.image.version }})'
    needs: version-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.version-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (opensearch)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./opensearch
          target: opensearch
          file: ./opensearch/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.image.isLatest && 'ghcr.io/netlogix/docker/opensearch:latest' || '' }}
            ${{ matrix.image.isLatestInMajor && format('ghcr.io/netlogix/docker/opensearch:{0}', matrix.image.major) || '' }}
            ghcr.io/netlogix/docker/opensearch:${{ matrix.image.minor }}
            ghcr.io/netlogix/docker/opensearch:${{ matrix.image.version }}
          build-args: |
            OPENSEARCH_VERSION=${{ matrix.image.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha, scope=${{ github.workflow }}-${{ matrix.image.name }}
          cache-to: type=gha, scope=${{ github.workflow }}-${{ matrix.image.name }}, mode=max
