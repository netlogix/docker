name: 'Get BuildMatrix with active maintained versions for a service'

inputs:
  product:
    description: 'product name of the service (https://endoflife.date/)'
    required: true

outputs:
  matrix:
    description: 'JSON string of the matrix'
    value: ${{ steps.fetch-versions.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: Fetch and Filter Versions
      id: fetch-versions
      shell: bash
      env:
        PRODUCT: ${{ inputs.product }}
      run: |
        # endoflife.date lists releases newest first, so index 0 is the latest release
        curl -fsS --retry 3 "https://endoflife.date/api/v1/products/${PRODUCT}" | \
          jq -c '
            [.result.releases | map(select(.isMaintained == true)) | to_entries[]
              | (.value.latest.name | split(".")) as $v
              | { "name": .value.name, "version": .value.latest.name, "major": $v[0], "minor": ($v[0:2] | join(".")), "isLatest": (.key == 0) }]
            | . as $all
            | map(. as $r | . + { "isLatestInMajor": (($all | map(select(.major == $r.major)) | first | .name) == $r.name) })
          ' | \
          sed 's/^/matrix=/' >> $GITHUB_OUTPUT
