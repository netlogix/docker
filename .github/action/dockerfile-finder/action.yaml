name: 'Find matching Dockerfile'
description: 'Finds the most specific <version>.Dockerfile (8.1.2 -> 8.1 -> 8) and falls back to Dockerfile'

inputs:
  path:
    description: 'the path to search for the dockerfile'
    required: true

  version:
    description: 'The version of the service (e.g., 8.1.2)'
    required: true

outputs:
  dockerfile:
    description: 'Dockerfile name'
    value: ${{ steps.find-dockerfile.outputs.dockerfile }}

runs:
  using: composite
  steps:
    - name: Find Dockerfile
      id: find-dockerfile
      shell: bash
      env:
        SEARCH_PATH: ${{ inputs.path }}
        VERSION: ${{ inputs.version }}
      run: |
        find_dockerfile() {
          local search_path="$1"
          local current="$2"

          while [[ -n "$current" ]]; do
            if [[ -f "${search_path}/${current}.Dockerfile" ]]; then
              echo "${current}.Dockerfile"
              return 0
            fi

            # Remove last dot-segment (2.1.3 -> 2.1 -> 2)
            [[ "$current" == *.* ]] || break
            current="${current%.*}"
          done

          # Fallback to default Dockerfile
          if [[ -f "${search_path}/Dockerfile" ]]; then
            echo "Dockerfile"
            return 0
          fi

          return 1
        }

        if [[ ! -d "$SEARCH_PATH" ]]; then
          echo "Error: Directory '$SEARCH_PATH' not found" >&2
          exit 1
        fi

        if DOCKERFILE_NAME=$(find_dockerfile "$SEARCH_PATH" "$VERSION"); then
          echo "dockerfile=${DOCKERFILE_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "Error: No matching Dockerfile found" >&2
          exit 1
        fi
