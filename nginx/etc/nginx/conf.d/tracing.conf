# this creates a tracing ID that will be propagated to all following requests.
# it will use the current RequestID but prefer the trace id of an incoming W3C traceparent header,
# then the value from an incoming X-Tracing-ID header.
# this allows re-using the tracingID for sub requests made by an application.
# example: user->proxy->webserver->php->proxy->solr will use the same tracingID
#
# only the trace id is used, applications must not depend on the parent id of the traceparent header.
# these maps are obsolete when the ngx_otel_module takes over ($otel_trace_id).

map $http_x_tracing_id $legacyTraceId {
	# the incoming header is empty (or does not exist) -> use current requestID
	"" $request_id;

	# the incoming header is a hex string with length 32 -> use it
	"~^[0-9a-fA-F]{32}$" $http_x_tracing_id;

	# fallthrough: incoming header is set but not a hex string -> use hardcoded string to make it clear something happened
	default "00000000000000000000000000000000";
}

# W3C trace context (https://www.w3.org/TR/trace-context/): version 00, lower case hex,
# neither trace id nor parent id consisting of zeros only
map $http_traceparent $traceparentTraceId {
	default "";
	"~^00-(?<tpTraceId>(?!0{32})[0-9a-f]{32})-(?!0{16})[0-9a-f]{16}-[0-9a-f]{2}$" $tpTraceId;
}

# a valid traceparent wins, otherwise X-Tracing-ID or the current requestID
map $traceparentTraceId $traceId {
	"" $legacyTraceId;
	default $traceparentTraceId;
}

# span id for a traceparent header created here, a valid incoming one is passed on as it is
map $request_id $traceSpanId {
	"~^(?<tpSpanId>[0-9a-f]{16})" $tpSpanId;
}

map $traceparentTraceId $traceparent {
	"" "00-$traceId-$traceSpanId-01";
	default $http_traceparent;
}
