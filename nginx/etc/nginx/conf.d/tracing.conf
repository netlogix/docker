# this creates a tracing ID that will be propagated to all following requests.
# it will use the current RequestID but prefer the value from an incoming X-Tracing-ID header.
# without that header the trace id of an incoming W3C traceparent header is used.
# this allows re-using the tracingID for sub requests made by an application.
# example: user->proxy->webserver->php->proxy->solr will use the same tracingID
#
# only the trace id is used, applications must not depend on the parent id of the traceparent header.
# these maps are obsolete when the ngx_otel_module takes over ($otel_trace_id).

# W3C trace context (https://www.w3.org/TR/trace-context/): version 00, lower case hex,
# neither trace id nor parent id consisting of zeros only
map $http_traceparent $traceparentTraceId {
	default "";
	"~^00-(?<tpTraceId>(?!0{32})[0-9a-f]{32})-(?!0{16})[0-9a-f]{16}-[0-9a-f]{2}$" $tpTraceId;
}

# no valid traceparent -> use current requestID
map $traceparentTraceId $traceIdWithoutHeader {
	"" $request_id;
	default $traceparentTraceId;
}

map $http_x_tracing_id $traceId {
	# the incoming header is empty (or does not exist) -> use the trace id of traceparent or current requestID
	"" $traceIdWithoutHeader;

	# the incoming header is a hex string with length 32 -> use it
	"~^[0-9a-fA-F]{32}$" $http_x_tracing_id;

	# fallthrough: incoming header is set but not a hex string -> use hardcoded string to make it clear something happened
	default "00000000000000000000000000000000";
}

# span id for a traceparent header created here
map $request_id $traceSpanId {
	"~^(?<tpSpanId>[0-9a-f]{16})" $tpSpanId;
}

# a valid incoming traceparent is passed on as it is as long as it carries the trace id in use,
# otherwise (no or invalid traceparent, X-Tracing-ID with another id) one is built from the trace id
map "$traceparentTraceId|$traceId" $traceparentUnchanged {
	default "";
	"~^([0-9a-f]{32})\|\1$" $http_traceparent;
}

# an all-zero trace id is not valid in a traceparent header, use the requestID instead of the marker for malformed ids
map $traceId $traceparentTraceIdToBuild {
	"00000000000000000000000000000000" $request_id;
	default $traceId;
}

map $traceparentUnchanged $traceparent {
	"" "00-$traceparentTraceIdToBuild-$traceSpanId-01";
	default $traceparentUnchanged;
}
